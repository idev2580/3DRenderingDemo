<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Three.js GLTF Scene</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #15171c;
        color: #f5f7fb;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      #viewport {
        width: 100%;
        height: 100%;
      }

      #status {
        position: fixed;
        left: 16px;
        bottom: 16px;
        max-width: min(360px, calc(100vw - 32px));
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 6px;
        background: rgba(14, 16, 21, 0.74);
        font-size: 14px;
        line-height: 1.45;
        backdrop-filter: blur(8px);
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
          "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.1.0/spark.module.js",
          "config": "./config.js",
          "util": "./util.js",
          "loader": "./loader.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="viewport" aria-label="Three.js GLTF renderer"></main>
    <div id="status">GLTF 장면 로딩 중...</div>
    <script type="module" src="render.js"></script>
  </body>
</html>
